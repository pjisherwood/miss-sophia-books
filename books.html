<meta property="og:url" content="https://misssophiabooks.com/books.html">

<meta name="twitter:description" content="Books by Paul Isherwood: The Wisdom of Aloharin, The Most Important Hour, A Christmas Dream and The Most Important Hour of Your Life. Read, or listen to the audiobooks.">
<meta name="twitter:image" content="https://misssophiabooks.com/share/books.jpg">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap" style="padding-top:30px">
  <h1 class="title">The Books</h1>
  <p class="soft">By Paul Isherwood.</p>
  <div id="list"></div>
  <h2 class="eyebrow" style="margin-top:40px">Free stories</h2>
  <div id="free"></div>
</main>
<div id="site-footer"></div>
<script src="content.js"></script>
<script src="site.js"></script>
<script>
  const HEAD = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="3" y="13" width="4.5" height="7" rx="1.6" fill="currentColor"/><rect x="16.5" y="13" width="4.5" height="7" rx="1.6" fill="currentColor"/></svg>';
  /* A book with an audiobook on this site gets a main button first (hear a free sample, then buy), then Amazon, then Spotify, the last two smaller. */
  function buyRow(b){
    const paid = (typeof AUDIOBOOKS !== 'undefined') && AUDIOBOOKS.find(a => a.bookSlug === b.slug && a.access === 'paid');
    if(paid) return `<div class="buy has-main">
        <div class="mainrow"><a class="btn main" href="/audiobook/${paid.slug}"><span class="m1">${HEAD}Audiobook · ${esc(paid.priceText)}</span><span class="m2">Hear a free sample first</span></a></div>
        <a class="btn small" href="${b.url}">The book on Amazon</a>${b.audiobook?`<a class="btn small spotify" href="${b.audiobook}" target="_blank" rel="noopener">${HEAD}Audiobook on Spotify</a>`:''}</div>`;
    return `<div class="buy"><a class="btn" href="${b.url}">Find it on Amazon</a>${b.audiobook?`<a class="btn spotify" href="${b.audiobook}" target="_blank" rel="noopener">${HEAD}Audiobook on Spotify</a>`:''}</div>`;
  }
  const ALL_BOOKS = BOOKS.concat(EARLIER_BOOKS.map(x => Object.assign({ earlier:true, inside:[] }, x)));
  $('#list').innerHTML = ALL_BOOKS.map(b => `<article class="book-row" id="${b.slug}">
    <div class="cover" style="background-image:url('${b.image}');background-size:cover"></div>
    <div>
      ${b.earlier?'<p class="era-label">An earlier book</p>':''}
      <h3>${esc(b.title)}</h3>
      <p class="tag">${esc(b.tagline)}</p>
      ${b.intro.map(p=>`<p>${esc(p)}</p>`).join('')}
      <details><summary>Read more</summary>
        ${b.more.map(p=>`<p>${esc(p)}</p>`).join('')}
        ${b.inside.length?`<p class="inside-h">What’s inside</p><ul>${b.inside.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}
        ${b.note?`<p class="soft">${esc(b.note)} <a href="#most-important-hour">See it above.</a></p>`:''}
      </details>
      ${buyRow(b)}
    </div></article>`).join('');
  $('#free').innerHTML = WISDOM.filter(w => w.cover).map(w => `<div class="book-row">
    <div class="cover" style="background-image:url('${w.cover}');background-size:cover"></div>
    <div><h3>${esc(w.title)}</h3><p style="margin:6px 0 10px">${esc(w.summary)}</p><a class="btn ghost" href="${pieceHref(w.slug)}">Read it here</a></div>
  </div>`).join('');
</script>
</body>
</html>
